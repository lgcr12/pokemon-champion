<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="AI 配队效果展示">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#f5f3ff"/><stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#101828" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="70" y="78" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="900" fill="#101828">AI 配队：单打 / 双打分开生成</text>
  <text x="72" y="114" font-family="Inter,Segoe UI,Arial" font-size="17" fill="#64748b">同一核心在不同规则下会得到不同队伍、配招和风险提示。</text>
  <g filter="url(#shadow)">
    <rect x="70" y="158" width="540" height="470" rx="22" fill="#fff" stroke="#dbe3ee"/>
    <rect x="670" y="158" width="540" height="470" rx="22" fill="#fff" stroke="#dbe3ee"/>
    <rect x="70" y="158" width="540" height="6" fill="#2563eb"/>
    <rect x="670" y="158" width="540" height="6" fill="#22c55e"/>
    <text x="104" y="212" font-family="Inter,Segoe UI,Arial" font-size="28" font-weight="900" fill="#101828">单打方案</text>
    <text x="704" y="212" font-family="Inter,Segoe UI,Arial" font-size="28" font-weight="900" fill="#101828">双打方案</text>
    <text x="104" y="246" font-family="Inter,Segoe UI,Arial" font-size="15" fill="#64748b">撒场、强化、轮转、终盘清场</text>
    <text x="704" y="246" font-family="Inter,Segoe UI,Arial" font-size="15" fill="#64748b">守住、控速、集火、站场协作</text>
    <g>
      <rect x="104" y="288" width="210" height="92" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
      <rect x="340" y="288" width="210" height="92" rx="14" fill="#f8fafc" stroke="#dbe3ee"/>
      <rect x="104" y="404" width="210" height="92" rx="14" fill="#f8fafc" stroke="#dbe3ee"/>
      <rect x="340" y="404" width="210" height="92" rx="14" fill="#f8fafc" stroke="#dbe3ee"/>
      <text x="128" y="322" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="900" fill="#101828">核心突破</text>
      <text x="128" y="350" font-family="Inter,Segoe UI,Arial" font-size="13" fill="#64748b">剑舞 / 撒场 / 收尾</text>
      <text x="364" y="322" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="900" fill="#101828">高速压制</text>
      <text x="364" y="350" font-family="Inter,Segoe UI,Arial" font-size="13" fill="#64748b">围巾 / 先制 / 清场</text>
      <text x="128" y="438" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="900" fill="#101828">换入链</text>
      <text x="128" y="466" font-family="Inter,Segoe UI,Arial" font-size="13" fill="#64748b">抗性 / 转场 / 清场</text>
      <text x="364" y="438" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="900" fill="#101828">风险提示</text>
      <text x="364" y="466" font-family="Inter,Segoe UI,Arial" font-size="13" fill="#64748b">重复道具 / Mega 限制</text>
    </g>
    <g>
      <rect x="704" y="288" width="210" height="92" rx="14" fill="#ecfdf5" stroke="#bbf7d0"/>
      <rect x="940" y="288" width="210" height="92" rx="14" fill="#f8fafc" stroke="#dbe3ee"/>
      <rect x="704" y="404" width="210" height="92" rx="14" fill="#f8fafc" stroke="#dbe3ee"/>
      <rect x="940" y="404" width="210" height="92" rx="14" fill="#f8fafc" stroke="#dbe3ee"/>
      <text x="728" y="322" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="900" fill="#101828">首回合节奏</text>
      <text x="728" y="350" font-family="Inter,Segoe UI,Arial" font-size="13" fill="#64748b">击掌 / 守住 / 集火</text>
      <text x="964" y="322" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="900" fill="#101828">控速系统</text>
      <text x="964" y="350" font-family="Inter,Segoe UI,Arial" font-size="13" fill="#64748b">顺风 / 空间 / 冰风</text>
      <text x="728" y="438" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="900" fill="#101828">站场协作</text>
      <text x="728" y="466" font-family="Inter,Segoe UI,Arial" font-size="13" fill="#64748b">威吓 / 广防 / 看我嘛</text>
      <text x="964" y="438" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="900" fill="#101828">双打检查</text>
      <text x="964" y="466" font-family="Inter,Segoe UI,Arial" font-size="13" fill="#64748b">守住数量 / 集火风险</text>
    </g>
    <rect x="104" y="542" width="210" height="42" rx="10" fill="#101828"/>
    <text x="156" y="568" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="900" fill="#fff">应用单打</text>
    <rect x="704" y="542" width="210" height="42" rx="10" fill="#101828"/>
    <text x="756" y="568" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="900" fill="#fff">应用双打</text>
  </g>
</svg>
