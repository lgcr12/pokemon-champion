      <rect x="813" y="340" width="160" height="138" rx="16" fill="#f8fafc" stroke="#dbe3ee"/>
      <rect x="990" y="340" width="160" height="138" rx="16" fill="#f8fafc" stroke="#dbe3ee"/>
