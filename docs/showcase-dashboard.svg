  <text x="70" y="76" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="900" fill="#101828">主界面：队伍构筑工作台</text>
  <text x="72" y="112" font-family="Inter,Segoe UI,Arial" font-size="17" fill="#64748b">从环境排名、热门队伍、AI 建议到导出校验，集中在一个高级仪表盘里。</text>
  <g filter="url(#shadow)">
