<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="导出和校验效果展示">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#101828" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="70" y="78" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="900" fill="#101828">PKHeX 友好导出与规则检查</text>
  <text x="72" y="114" font-family="Inter,Segoe UI,Arial" font-size="17" fill="#64748b">Showdown 文本、JSON 草稿、重复道具、Mega 限制和 EV 校验都在同一处完成。</text>
  <g filter="url(#shadow)">
    <rect x="70" y="154" width="560" height="486" rx="22" fill="#fff" stroke="#dbe3ee"/>
    <rect x="670" y="154" width="540" height="486" rx="22" fill="#fff" stroke="#dbe3ee"/>
    <text x="104" y="210" font-family="Consolas,monospace" font-size="14" font-weight="900" fill="#2563eb">SHOWDOWN EXPORT</text>
    <rect x="104" y="240" width="492" height="294" rx="14" fill="#0f172a"/>
    <text x="128" y="280" font-family="Consolas,monospace" font-size="15" fill="#e2e8f0">Garchomp @ Life Orb</text>
    <text x="128" y="310" font-family="Consolas,monospace" font-size="15" fill="#93c5fd">Ability: Rough Skin</text>
    <text x="128" y="340" font-family="Consolas,monospace" font-size="15" fill="#86efac">Level: 50</text>
    <text x="128" y="370" font-family="Consolas,monospace" font-size="15" fill="#fbbf24">Tera Type: Ground</text>
    <text x="128" y="400" font-family="Consolas,monospace" font-size="15" fill="#f8fafc">EVs: 252 Atk / 4 SpD / 252 Spe</text>
    <text x="128" y="430" font-family="Consolas,monospace" font-size="15" fill="#f8fafc">Jolly Nature</text>
    <text x="128" y="460" font-family="Consolas,monospace" font-size="15" fill="#f8fafc">- Earthquake</text>
    <text x="128" y="490" font-family="Consolas,monospace" font-size="15" fill="#f8fafc">- Dragon Claw</text>
    <rect x="104" y="558" width="132" height="40" rx="10" fill="#101828"/>
    <text x="140" y="583" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="900" fill="#fff">复制文本</text>
    <rect x="250" y="558" width="132" height="40" rx="10" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="288" y="583" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="900" fill="#101828">下载 TXT</text>
    <rect x="396" y="558" width="132" height="40" rx="10" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="435" y="583" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="900" fill="#101828">导出 JSON</text>
    <text x="704" y="210" font-family="Consolas,monospace" font-size="14" font-weight="900" fill="#f97316">RULE CHECKS</text>
    <g font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="800">
      <rect x="704" y="240" width="430" height="46" rx="23" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="728" y="269" fill="#9a3412">重复道具：两只宝可梦携带 Life Orb</text>
      <rect x="704" y="306" width="430" height="46" rx="23" fill="#fef2f2" stroke="#fecaca"/>
      <text x="728" y="335" fill="#991b1b">Mega 进化限制：同队超过 1 个 Mega 石</text>
      <rect x="704" y="372" width="430" height="46" rx="23" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="728" y="401" fill="#9a3412">EV 总和 524 超过 510</text>
      <rect x="704" y="438" width="430" height="46" rx="23" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="728" y="467" fill="#1d4ed8">提示：未填写太晶属性，可按规则忽略</text>
      <rect x="704" y="504" width="430" height="46" rx="23" fill="#ecfdf5" stroke="#bbf7d0"/>
      <text x="728" y="533" fill="#047857">基础字段完整后建议用 PKHeX 终检</text>
    </g>
  </g>
</svg>
